<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador TOTP (OTPAuth)</title>
    <!-- Usamos la librería OTPAuth oficial y mantenida vía CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 360px;
            border: 1px solid #334155;
        }

        h2 {
            margin: 0 0 1.5rem 0;
            color: #94a3b8;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .totp-code {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 8px;
            color: #38bdf8;
            margin: 1rem 0 1.5rem 0;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .progress-container {
            width: 100%;
            background-color: #334155;
            border-radius: 9999px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }

        .progress-bar {
            height: 100%;
            background-color: #38bdf8;
            width: 100%;
            transition: width 0.2s linear, background-color 0.3s ease;
            border-radius: 9999px;
        }

        .timer-text {
            font-size: 0.875rem;
            color: #64748b;
        }

        .timer-text span {
            color: #cbd5e1;
            font-weight: 600;
        }

        .error {
            color: #f87171 !important;
            font-size: 1.25rem !important;
            letter-spacing: normal !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Código</h2>
        <div id="otp" class="totp-code">------</div>
        <div class="progress-container">
            <div id="progress" class="progress-bar"></div>
        </div>
        <div class="timer-text">Renovación en <span id="seconds">30</span>s</div>
    </div>

    <script>
        // ====================================================
        // PON AQUÍ TU CLAVE PRIVADA EN FORMATO BASE32
        // ====================================================
        const SECRET_KEY = "ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ"; 

        // Creamos la instancia TOTP usando la librería OTPAuth
        let totp;
        try {
            totp = new OTPAuth.TOTP({
                issuer: "MiApp",
                label: "Usuario",
                algorithm: "SHA1",
                digits: 6,
                period: 30,
                secret: OTPAuth.Secret.fromBase32(SECRET_KEY.replace(/\s+/g, '').toUpperCase())
            });
        } catch (e) {
            console.error("Error al inicializar TOTP:", e);
        }

        function updateTOTP() {
            const otpElement = document.getElementById('otp');
            if (!totp) {
                otpElement.textContent = "CLAVE INVÁLIDA";
                otpElement.classList.add("error");
                return;
            }

            try {
                const code = totp.generate();
                otpElement.textContent = `${code.slice(0, 3)} ${code.slice(3)}`;
            } catch (error) {
                otpElement.textContent = "ERROR";
                otpElement.classList.add("error");
                console.error("Error generando TOTP:", error);
            }
        }

        function updateTimer() {
            const epoch = Math.floor(Date.now() / 1000);
            const secondsLeft = 30 - (epoch % 30);

            document.getElementById('seconds').textContent = secondsLeft;

            const percentage = (secondsLeft / 30) * 100;
            const progressBar = document.getElementById('progress');
            progressBar.style.width = `${percentage}%`;

            if (secondsLeft <= 5) {
                progressBar.style.backgroundColor = '#ef4444';
            } else {
                progressBar.style.backgroundColor = '#38bdf8';
            }

            // Actualizar el código si nos encontramos exactamente al inicio del intervalo
            if (secondsLeft === 30 || document.getElementById('otp').textContent.includes('-')) {
                updateTOTP();
            }
        }

        updateTOTP();
        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
